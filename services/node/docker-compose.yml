services:
  node:
    image: node:20-alpine
    container_name: node
    working_dir: /app
    command: >
      sh -c "
      if [ ! -d node_modules ]; then
        echo '📦 Installation des dépendances npm...' &&
        npm install;
      fi &&
      echo '🚀 Démarrage de l application...' &&
      node index.js
      "
    environment:
      NODE_ENV: production
      PORT: ${NODE_INTERNAL_PORT}
    volumes:
      - ../../sites/NODE/express:/app:rw
    networks:
      app_network:
        aliases: ["node"]
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NODE_INTERNAL_PORT}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  app_network:
    external: true
